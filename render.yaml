services:
  - type: web
    name: thulani-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
